<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%">
  <rect width="940" height="580" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="940" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="310" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: GitHub SSH Authentication &amp; Push</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Command 1: Test GitHub connection -->
    <text x="24" y="66" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="66" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="220" y="66" fill="rgb(56, 189, 248)">ssh -T git@github.com</text>
    <text x="24" y="92" fill="rgb(34, 197, 94)" font-weight="bold">Hi nguyenvana-ptit! You've successfully authenticated, but GitHub does not provide shell access.</text>

    <!-- Command 2: git remote add -->
    <text x="24" y="132" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="132" fill="rgb(248, 250, 252)">:~/my-project$ </text>
    <text x="300" y="132" fill="rgb(56, 189, 248)">git remote add origin git@github.com:nguyenvana-ptit/ptit-devops-project.git</text>

    <!-- Command 3: git remote -v -->
    <text x="24" y="172" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="172" fill="rgb(248, 250, 252)">:~/my-project$ </text>
    <text x="300" y="172" fill="rgb(56, 189, 248)">git remote -v</text>
    <text x="24" y="198" fill="rgb(203, 213, 225)">origin  git@github.com:nguyenvana-ptit/ptit-devops-project.git (fetch)</text>
    <text x="24" y="220" fill="rgb(203, 213, 225)">origin  git@github.com:nguyenvana-ptit/ptit-devops-project.git (push)</text>

    <!-- Command 4: git push -u origin main -->
    <text x="24" y="260" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="260" fill="rgb(248, 250, 252)">:~/my-project$ </text>
    <text x="300" y="260" fill="rgb(56, 189, 248)">git push -u origin main</text>
    <text x="24" y="286" fill="rgb(203, 213, 225)">Enumerating objects: 6, done.</text>
    <text x="24" y="308" fill="rgb(203, 213, 225)">Counting objects: 100% (6/6), done.</text>
    <text x="24" y="330" fill="rgb(203, 213, 225)">Delta compression using up to 8 threads</text>
    <text x="24" y="352" fill="rgb(203, 213, 225)">Compressing objects: 100% (4/4), done.</text>
    <text x="24" y="374" fill="rgb(203, 213, 225)">Writing objects: 100% (6/6), 842 bytes | 842.00 KiB/s, done.</text>
    <text x="24" y="396" fill="rgb(203, 213, 225)">Total 6 (delta 1), reused 0 (delta 0), pack-reused 0</text>
    <text x="24" y="418" fill="rgb(34, 197, 94)">To github.com:nguyenvana-ptit/ptit-devops-project.git</text>
    <text x="24" y="440" fill="rgb(56, 189, 248)"> * [new branch]      main -&gt; main</text>
    <text x="24" y="462" fill="rgb(34, 197, 94)">branch 'main' set up to track 'origin/main'.</text>

    <!-- Command 5: git status after push -->
    <text x="24" y="502" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="502" fill="rgb(248, 250, 252)">:~/my-project$ </text>
    <text x="300" y="502" fill="rgb(56, 189, 248)">git status</text>
    <text x="24" y="528" fill="rgb(203, 213, 225)">On branch main</text>
    <text x="24" y="548" fill="rgb(34, 197, 94)">Your branch is up to date with 'origin/main'. Nothing to commit.</text>
  </g>
</svg>
